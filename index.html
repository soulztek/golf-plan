<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f3f6f9" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="GolfPlan" />
<meta name="description" content="Golf Speed Plan: daily check-ins, mobility timer, drills and speed log." />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<title>Golf Speed Plan</title>
<style>
  :root{--bg:#f3f6f9;--elev:#ffffff;--card:#ffffff;--fill2:#eef3f1;--border:#e2e8ee;--border-strong:#b9c7d3;--focus:#2f9e5c;--primary:#2f9e5c;--blue:#2f7fd8;--accent-subtle:rgba(47,158,92,0.10);--text:#16212b;--text2:#4b5a67;--text3:#7f8c98;--link:#1f7a46;--zebra:rgba(20,40,60,0.03);--shadow:0 6px 22px rgba(25,45,70,0.07);--glass:rgba(255,255,255,0.86);--nav:rgba(255,255,255,0.94);color-scheme:light}
  :root[data-theme=dark]{--bg:#0b1510;--elev:#13231a;--card:#10201a;--fill2:#1b3326;--border:#24402f;--border-strong:#4c7a5e;--focus:#5cc98a;--primary:#2f9e5c;--blue:#56a3f2;--accent-subtle:rgba(92,201,138,0.14);--text:#eef5ef;--text2:#a9c2b1;--text3:#7c9886;--link:#8fe0b0;--zebra:rgba(255,255,255,0.03);--shadow:0 6px 22px rgba(0,0,0,0.35);--glass:rgba(16,32,26,0.82);--nav:rgba(12,24,18,0.94);color-scheme:dark}
  main *,section *{min-width:0} html,body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  button,input,select{font:inherit;}
  table{border-collapse:collapse;width:100%;}
  ::-webkit-scrollbar{height:4px;width:4px}
  .hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;scrollbar-width:none}
  .hscroll::-webkit-scrollbar{display:none}
  .hscroll>*{scroll-snap-align:start}
</style>
</head>
<body>
<script>try{var u=JSON.parse(localStorage.getItem("golf-speed-plan-ui")||"{}");if(u.dark)document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
